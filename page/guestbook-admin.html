<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>KÖNIGIN · 留言管理</title>
  <style>
    :root{
      --gold: #c9a24a;
      --gold-soft: #d8b968;
      --ink: #0d0a07;
      --paper: #ece0c7;
      --paper-dim: #b8a884;
      --danger: #d98b7a;
      --serif: "Cormorant Garamond", "EB Garamond", "Times New Roman", "Songti SC", "SimSun", serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--ink); color: var(--paper); font-family: var(--serif); min-height: 100vh; }
    body { padding: calc(24px + env(safe-area-inset-top, 0px)) 18px 48px; }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 { font-weight: 400; letter-spacing: .14em; font-size: 28px; margin: 0 0 6px; color: #f2e6ca; }
    .sub { color: var(--paper-dim); font-size: 12px; letter-spacing: .25em; margin: 0 0 28px; }
    .sub a { color: var(--gold-soft); }

    input, textarea {
      width: 100%;
      background: rgba(22,17,11,.8);
      border: 1px solid rgba(201,162,74,.3);
      color: var(--paper);
      font: inherit;
      font-size: 16px;
      padding: 10px 12px;
      border-radius: 0;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--gold); }
    textarea { min-height: 80px; resize: vertical; line-height: 1.7; }
    .btn {
      background: transparent;
      border: 1px solid rgba(201,162,74,.6);
      color: var(--gold-soft);
      font: inherit;
      font-size: 13px;
      letter-spacing: .15em;
      padding: 7px 14px;
      cursor: pointer;
    }
    .btn:hover:not(:disabled) { background: rgba(201,162,74,.12); color: var(--paper); }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn.danger { border-color: rgba(217,139,122,.6); color: var(--danger); }
    .btn.active { background: rgba(201,162,74,.18); color: var(--paper); border-color: var(--gold); }

    .login { display: flex; gap: 10px; }
    .login .btn { white-space: nowrap; }
    .err { color: var(--danger); font-size: 13px; min-height: 1em; margin: 10px 0 0; }

    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .tabs .spacer { flex: 1; }
    .card {
      border: 1px solid rgba(201,162,74,.2);
      padding: 16px;
      margin-bottom: 12px;
      background: rgba(22,17,11,.5);
    }
    .card.flagged { border-color: rgba(217,139,122,.6); }
    .meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .name { color: #ead7a3; letter-spacing: .1em; }
    .date { color: var(--paper-dim); font-size: 12px; }
    .body { white-space: pre-wrap; word-break: break-word; line-height: 1.8; margin: 0 0 10px; color: #d8c89f; }
    .info { font-size: 11px; color: var(--paper-dim); opacity: .7; word-break: break-all; margin-bottom: 10px; }
    .flag { color: var(--danger); font-size: 12px; margin-bottom: 8px; }
    .reply-label { font-size: 11px; letter-spacing: .25em; color: var(--gold-soft); margin: 6px 0; display: block; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .state { text-align: center; color: var(--paper-dim); padding: 30px 0; letter-spacing: .1em; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>留言管理</h1>
    <p class="sub">GUESTBOOK ADMIN · <a href="guestbook.html">查看留言板 →</a></p>

    <section id="loginBox">
      <form class="login" id="loginForm">
        <input type="password" id="pwd" placeholder="管理密码" autocomplete="current-password">
        <button class="btn" type="submit">进入</button>
      </form>
      <p class="err" id="loginErr"></p>
    </section>

    <section id="panel" hidden>
      <div class="tabs">
        <button class="btn active" data-status="pending">待审核 <span id="cntPending"></span></button>
        <button class="btn" data-status="approved">已公开 <span id="cntApproved"></span></button>
        <span class="spacer"></span>
        <button class="btn" id="refresh">刷新</button>
        <button class="btn" id="logout">退出</button>
      </div>
      <p class="err" id="panelErr"></p>
      <div id="list"></div>
      <div class="actions" id="moreWrap" hidden style="justify-content:center">
        <button class="btn" id="more">加载更多</button>
      </div>
    </section>
  </div>

<script>
(function () {
  const API = '/api/guestbook';
  let password = '';
  let status = 'pending';
  let nextOffset = null;

  const $ = id => document.getElementById(id);
  try { password = sessionStorage.getItem('gb-admin') || ''; } catch (e) {}

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fmtDate(ts) {
    return new Date(ts).toLocaleString('zh-CN', { hour12: false });
  }

  async function api(method, query, body) {
    const res = await fetch(API + (query || ''), {
      method,
      headers: Object.assign({ 'x-admin-password': password }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) { logout(); throw new Error('密码错误'); }
    if (!res.ok) throw new Error(data.error || '请求失败');
    return data;
  }

  function renderCard(m) {
    const card = el('article', 'card' + (m.flag ? ' flagged' : ''));
    const meta = el('div', 'meta');
    meta.append(el('span', 'name', m.name), el('span', 'date', fmtDate(m.createdAt)));
    card.append(meta);
    if (m.flag) card.append(el('div', 'flag', '⚠ 命中敏感词：' + m.flag));
    card.append(el('p', 'body', m.message));
    card.append(el('div', 'info', 'IP ' + (m.ip || '-') + (m.country ? ' · ' + m.country : '') + ' · ' + (m.ua || '')));

    const replyLabel = el('label', 'reply-label', '站主回复（留空则不显示）');
    const replyBox = el('textarea');
    replyBox.value = m.reply || '';
    replyBox.maxLength = 1000;
    card.append(replyLabel, replyBox);

    const actions = el('div', 'actions');
    const btn = (text, cls, fn) => {
      const b = el('button', 'btn' + (cls ? ' ' + cls : ''), text);
      b.type = 'button';
      b.addEventListener('click', async () => {
        actions.querySelectorAll('button').forEach(x => x.disabled = true);
        try { await fn(); } catch (err) { $('panelErr').textContent = err.message; }
        actions.querySelectorAll('button').forEach(x => x.disabled = false);
      });
      return b;
    };
    actions.append(btn('保存回复', '', async () => {
      await api('POST', '', { action: 'reply', id: m.id, reply: replyBox.value });
      $('panelErr').textContent = '';
    }));
    if (m.status === 'pending') {
      actions.append(btn('通过并公开', '', async () => {
        if (replyBox.value !== (m.reply || '')) await api('POST', '', { action: 'reply', id: m.id, reply: replyBox.value });
        await api('POST', '', { action: 'approve', id: m.id });
        card.remove(); refreshCounts();
      }));
    } else {
      actions.append(btn('撤回（不公开）', '', async () => {
        await api('POST', '', { action: 'hide', id: m.id });
        card.remove(); refreshCounts();
      }));
    }
    actions.append(btn('删除', 'danger', async () => {
      if (!confirm('删除后无法恢复，确定删除这条留言？')) return;
      await api('POST', '', { action: 'delete', id: m.id });
      card.remove(); refreshCounts();
    }));
    card.append(actions);
    return card;
  }

  async function refreshCounts() {
    try {
      const [p, a] = await Promise.all([
        api('GET', '?status=pending&offset=0'),
        api('GET', '?status=approved&offset=0')
      ]);
      $('cntPending').textContent = '(' + p.total + ')';
      $('cntApproved').textContent = '(' + a.total + ')';
      if (!$('list').children.length) $('list').append(el('p', 'state', '这里空空的'));
    } catch (e) {}
  }

  async function load(append) {
    $('panelErr').textContent = '';
    if (!append) { $('list').innerHTML = ''; $('list').append(el('p', 'state', '加载中……')); }
    try {
      const data = await api('GET', '?status=' + status + '&offset=' + (append ? nextOffset : 0));
      if (!append) $('list').innerHTML = '';
      data.items.forEach(m => $('list').append(renderCard(m)));
      if (!append && !data.items.length) $('list').append(el('p', 'state', '这里空空的'));
      nextOffset = data.nextOffset;
      $('moreWrap').hidden = nextOffset == null;
      $(status === 'pending' ? 'cntPending' : 'cntApproved').textContent = '(' + data.total + ')';
    } catch (err) {
      if (!append) $('list').innerHTML = '';
      $('panelErr').textContent = err.message;
    }
  }

  function showPanel() {
    $('loginBox').hidden = true;
    $('panel').hidden = false;
    load(false);
    refreshCounts();
  }
  function logout() {
    password = '';
    try { sessionStorage.removeItem('gb-admin'); } catch (e) {}
    $('panel').hidden = true;
    $('loginBox').hidden = false;
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    password = $('pwd').value;
    $('loginErr').textContent = '';
    try {
      await api('GET', '?status=pending&offset=0');
      try { sessionStorage.setItem('gb-admin', password); } catch (e2) {}
      $('pwd').value = '';
      showPanel();
    } catch (err) {
      $('loginErr').textContent = err.message;
    }
  });

  document.querySelectorAll('[data-status]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('[data-status]').forEach(x => x.classList.toggle('active', x === b));
    status = b.dataset.status;
    load(false);
  }));
  $('refresh').addEventListener('click', () => { load(false); refreshCounts(); });
  $('logout').addEventListener('click', logout);
  $('more').addEventListener('click', () => load(true));

  if (password) showPanel();
})();
</script>
</body>
</html>
