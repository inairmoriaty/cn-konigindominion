<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KÖNIGIN · The Parlour · 关于我</title>
  <style>
    :root{
      --gold: #c9a24a;
      --gold-soft: #d8b968;
      --ink: #0d0a07;
      --paper: #ece0c7;
      --paper-dim: #b8a884;
      --serif: "Cormorant Garamond", "EB Garamond", "Playfair Display", "Times New Roman", "Songti SC", "SimSun", "宋体", serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--serif);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(201,162,74,.08), transparent 60%),
        radial-gradient(900px 500px at 100% 100%, rgba(201,162,74,.06), transparent 60%),
        var(--ink);
      padding: calc(28px + var(--safe-top)) 24px calc(40px + var(--safe-bottom));
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 820px;
      margin: 0 auto 56px;
    }
    .logo-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--paper);
    }
    .logo-link img { height: 110px; width: auto; display: block; }
    .logo-link .mark { display: none; }
    .back-link {
      text-decoration: none;
      color: var(--gold-soft);
      letter-spacing: .25em;
      font-size: 12px;
      text-transform: uppercase;
      border: 1px solid rgba(201,162,74,.35);
      padding: 8px 14px;
      transition: border-color .2s ease, color .2s ease;
    }
    .back-link:hover { border-color: var(--gold); color: var(--paper); }

    .parlour {
      max-width: 720px;
      margin: 0 auto;
    }
    .parlour .eyebrow {
      color: var(--gold-soft);
      letter-spacing: .4em;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .parlour h1 {
      font-weight: 400;
      font-size: clamp(36px, 6vw, 56px);
      letter-spacing: .14em;
      margin: 0 0 8px;
      color: #f2e6ca;
    }
    .parlour .subtitle {
      color: var(--paper-dim);
      letter-spacing: .3em;
      font-size: 13px;
      margin-bottom: 40px;
    }
    .parlour hr {
      border: none;
      border-top: 1px solid rgba(201,162,74,.25);
      margin: 32px 0;
    }
    .parlour p {
      line-height: 2;
      font-size: 16px;
      color: #d8c89f;
      letter-spacing: .04em;
      margin: 0 0 1.2em;
    }
    .parlour .note {
      font-size: 13px;
      color: var(--paper-dim);
      font-style: italic;
      opacity: .75;
    }

    @media (max-width: 640px) {
      body { padding: calc(20px + var(--safe-top)) 18px calc(32px + var(--safe-bottom)); }
      .top-bar { margin-bottom: 36px; }
      .logo-link img { height: 34px; }
      .parlour p { font-size: 15px; }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <a class="logo-link" href="home.html" aria-label="KÖNIGIN — 返回首页">
      <img src="../img/logo_silver.png" alt="KÖNIGIN">
    </a>
    <a class="back-link" href="home.html">← Home</a>
  </header>

  <main class="parlour">
    <p class="eyebrow">THE PARLOUR</p>
    <h1>会客厅</h1>
    <p class="subtitle">About · 关于我</p>

    <hr>

    <!-- TODO: 替换为站主自我介绍正文 -->
    <p>欢迎来到 KÖNIGIN 的会客厅。</p>
    <p>这里是属于我自己的档案馆 —— 一个我用来存放文字、角色与世界的地方。有些故事已经写完，有些世界仍在生长。</p>
    <p>我写的内容大多围绕着几位角色与他们的平行宇宙展开，偏好克制、阴翳、带有一丝维多利亚气质的叙事。如果你在这里停留片刻、读到喜欢的段落，或只是单纯坐一会儿，我都会感到欣慰。</p>

    <hr>

    <p class="note">这是一个私人站点，所有内容属于我本人。请不要转载或搬运，谢谢。</p>
  </main>

<script src="../js/swipe-back.js"></script>
</body>
</html>
