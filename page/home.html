<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KÖNIGIN · Home</title>
  <link rel="preload" as="image" href="../img/home_bg_pc.png" media="(min-width: 768px)">
  <link rel="preload" as="image" href="../img/home_bg.png" media="(max-width: 767px)">
  <style>
    @font-face {
      font-family: "Plain Germanica";
      src: url("../style/Plain%20Germanica.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "OldeEnglish";
      src: url("../style/OldeEnglish.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    :root{
      --gold: #c9a24a;
      --gold-soft: #d8b968;
      --gold-dim: #8c7332;
      --ink: #0d0a07;
      --ink-2: #16110b;
      --paper: #ece0c7;
      --paper-dim: #b8a884;
      --serif: "Cormorant Garamond", "EB Garamond", "Playfair Display", "Times New Roman", "Songti SC", "SimSun", "宋体", serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--serif);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* 背景层 —— 桌面横版、移动竖版 */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url('../img/home_bg.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
    }
    @media (min-width: 768px) {
      .bg-layer {
        background-image: url('../img/home_bg_pc.png');
      }
    }
    .bg-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(13,10,7,.35) 0%, rgba(13,10,7,.15) 35%, rgba(13,10,7,.55) 100%);
      pointer-events: none;
    }

    /* ---------- 顶部 Logo ---------- */
    .top-bar {
      position: relative;
      z-index: 10;
      padding: calc(22px + var(--safe-top)) 28px 0 28px;
      display: flex;
      justify-content: flex-start;
      pointer-events: none;
    }
    .logo-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--paper);
      pointer-events: auto;
      transition: opacity .25s ease;
    }
    .logo-link:hover { opacity: .85; }
    .logo-link img {
      height: 140px;
      width: auto;
      display: block;
      filter: drop-shadow(0 4px 18px rgba(0,0,0,.65));
    }

    /* ---------- Hero / 中央文字 ---------- */
    main.hero {
      position: relative;
      z-index: 5;
      flex: 1 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      min-height: 60vh;
    }
    .welcome {
      max-width: 820px;
    }
    .welcome h1 {
      margin: 0 0 24px;
      font-family: "OldeEnglish", var(--serif);
      font-weight: 400;
      font-size: clamp(42px, 8vw, 92px);
      letter-spacing: .14em;
      color: #f2e6ca;
      text-shadow: 0 4px 24px rgba(0,0,0,.75), 0 0 1px rgba(201,162,74,.4);
    }
    .welcome .lede {
      font-size: clamp(14px, 2.2vw, 17px);
      line-height: 2;
      color: #d8c89f;
      letter-spacing: .08em;
      opacity: .92;
    }
    .welcome .lede p { margin: .3em 0; }

    /* ---------- Quick Access ---------- */
    .quick-access-wrap {
      position: relative;
      z-index: 5;
      padding: 24px 24px calc(28px + var(--safe-bottom));
    }
    .quick-access-label {
      display: flex;
      align-items: baseline;
      gap: 14px;
      color: var(--gold-soft);
      font-size: 11px;
      letter-spacing: .4em;
      text-transform: uppercase;
      margin: 0 0 14px 2px;
    }
    .quick-access-label .zh {
      color: var(--paper-dim);
      letter-spacing: .3em;
      font-size: 11px;
    }

    .quick-access {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .qa-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 150px;
      padding: 18px 20px 20px;
      text-decoration: none;
      color: var(--paper);
      border: 1px solid rgba(201,162,74,.35);
      background:
        linear-gradient(180deg, rgba(13,10,7,.25) 0%, rgba(13,10,7,.85) 100%),
        url('../img/home_bg.png') center/cover no-repeat;
      overflow: hidden;
      transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    }
    .qa-card::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(201,162,74,.12);
      pointer-events: none;
      transition: border-color .3s ease;
    }
    .qa-card:hover,
    .qa-card:focus-visible {
      transform: translateY(-2px);
      border-color: var(--gold);
      box-shadow: 0 10px 30px rgba(0,0,0,.55), 0 0 0 1px rgba(201,162,74,.25);
      outline: none;
    }
    .qa-card:hover::before,
    .qa-card:focus-visible::before { border-color: rgba(216,185,104,.45); }

    .qa-icon {
      font-family: var(--serif);
      color: var(--gold-soft);
      font-size: 22px;
      line-height: 1;
      margin-bottom: 10px;
      opacity: .85;
    }
    .qa-icon .mask-icon {
      display: block;
      width: 28px;
      height: 28px;
      background-color: var(--gold-soft);
      -webkit-mask: var(--mask-src) center/contain no-repeat;
      mask: var(--mask-src) center/contain no-repeat;
      opacity: .9;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.5));
    }
    .qa-en {
      font-size: 15px;
      letter-spacing: .28em;
      color: #ead7a3;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .qa-zh {
      font-size: 13px;
      letter-spacing: .18em;
      color: var(--paper-dim);
    }

    /* ---------- Featured Works 侧滑面板 ---------- */
    .fw-tab {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 30;
      writing-mode: vertical-rl;
      padding: 18px 10px;
      background: rgba(13,10,7,.78);
      color: var(--gold-soft);
      border: 1px solid rgba(201,162,74,.35);
      border-right: none;
      font-size: 11px;
      letter-spacing: .5em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      backdrop-filter: blur(4px);
      transition: background .25s ease, color .25s ease;
    }
    .fw-tab:hover { background: rgba(20,15,9,.9); color: var(--paper); }

    .fw-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0,0,0,.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease;
    }
    .fw-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .fw-panel {
      position: fixed;
      top: 0; right: 0;
      height: 100%;
      width: min(420px, 92vw);
      z-index: 50;
      background: linear-gradient(180deg, #120d08 0%, #0b0806 100%);
      border-left: 1px solid rgba(201,162,74,.3);
      box-shadow: -24px 0 60px rgba(0,0,0,.6);
      transform: translateX(100%);
      transition: transform .4s cubic-bezier(.33,1,.68,1);
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }
    .fw-panel.open { transform: translateX(0); }

    .fw-header {
      padding: 26px 26px 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      border-bottom: 1px solid rgba(201,162,74,.18);
    }
    .fw-header h2 {
      margin: 0;
      font-weight: 400;
      font-family: var(--serif);
      color: #ead7a3;
      letter-spacing: .3em;
      font-size: 15px;
    }
    .fw-header .fw-zh {
      display: block;
      margin-top: 6px;
      color: var(--paper-dim);
      font-size: 12px;
      letter-spacing: .25em;
    }
    .fw-close {
      background: none;
      border: 1px solid rgba(201,162,74,.3);
      color: var(--paper);
      width: 32px; height: 32px;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      transition: border-color .2s ease, color .2s ease;
    }
    .fw-close:hover { border-color: var(--gold); color: var(--gold-soft); }

    .fw-list {
      flex: 1;
      overflow-y: auto;
      padding: 18px 22px 10px;
      -webkit-overflow-scrolling: touch;
    }
    .fw-list::-webkit-scrollbar { width: 6px; }
    .fw-list::-webkit-scrollbar-thumb { background: rgba(201,162,74,.25); border-radius: 3px; }

    .fw-card {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 14px;
      padding: 14px 6px;
      border-bottom: 1px solid rgba(201,162,74,.12);
      text-decoration: none;
      color: var(--paper);
      transition: background .25s ease;
    }
    .fw-card:hover { background: rgba(201,162,74,.06); }
    .fw-card:last-child { border-bottom: none; }

    .fw-cover {
      width: 96px;
      height: 120px;
      background: #1a1309 center/cover no-repeat;
      border: 1px solid rgba(201,162,74,.2);
      flex-shrink: 0;
    }
    .fw-meta .title {
      font-size: 17px;
      letter-spacing: .1em;
      color: #ead7a3;
      margin: 0 0 8px;
      font-weight: 500;
    }
    .fw-meta .desc {
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--paper-dim);
      margin: 0 0 10px;
      letter-spacing: .04em;
    }
    .fw-meta .tag {
      display: inline-block;
      font-size: 10.5px;
      letter-spacing: .25em;
      color: var(--gold-soft);
      text-transform: uppercase;
      border-top: 1px solid rgba(201,162,74,.25);
      padding-top: 6px;
    }

    .fw-footer {
      padding: 18px 26px 24px;
      border-top: 1px solid rgba(201,162,74,.18);
      text-align: center;
    }
    .fw-footer a {
      color: var(--gold-soft);
      letter-spacing: .3em;
      font-size: 12px;
      text-decoration: none;
      text-transform: uppercase;
      transition: color .2s ease;
    }
    .fw-footer a:hover { color: var(--paper); }

    /* ---------- 小底栏 ---------- */
    .site-footline {
      position: relative;
      z-index: 5;
      padding: 14px 24px calc(14px + var(--safe-bottom));
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: .2em;
      color: var(--paper-dim);
      opacity: .7;
    }

    /* ---------- 响应式 ---------- */
    @media (max-width: 767px) {
      .top-bar { padding: calc(14px + var(--safe-top)) 16px 0 16px; }
      .logo-link img { height: 92px; }

      main.hero { min-height: 58vh; padding: 36px 20px; }
      .welcome h1 { letter-spacing: .1em; }
      .welcome .lede { line-height: 1.9; }

      .quick-access-wrap { padding: 12px 16px calc(24px + var(--safe-bottom)); }
      .quick-access { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .qa-card { min-height: 92px; padding: 14px 16px; }
      .qa-en { font-size: 13px; letter-spacing: .22em; }
      .qa-zh { font-size: 11.5px; letter-spacing: .14em; }

      .fw-tab {
        writing-mode: vertical-rl;
        padding: 14px 8px;
        font-size: 10px;
        letter-spacing: .4em;
      }

      .site-footline { font-size: 10px; flex-direction: column; gap: 6px; align-items: center; text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fw-panel, .fw-overlay, .qa-card { transition: none; }
    }
  </style>
</head>
<body>

  <div class="bg-layer" aria-hidden="true"></div>

  <header class="top-bar">
    <a href="home.html" class="logo-link" aria-label="KÖNIGIN — 返回首页">
      <img src="../img/logo_silver.png" alt="KÖNIGIN">
    </a>
  </header>

  <main class="hero">
    <div class="welcome">
      <h1>Welcome Home</h1>
      <div class="lede">
        <p>这里收藏着我创造的一切。</p>
      </div>
    </div>
  </main>

  <section class="quick-access-wrap" aria-label="Quick Access">
    <p class="quick-access-label">
      <span>QUICK ACCESS</span>
      <span class="zh">快捷入口</span>
    </p>
    <nav class="quick-access">
      <a class="qa-card" href="public/public.html">
        <span class="qa-icon" aria-hidden="true">❦</span>
        <span class="qa-en">THE CELLAR</span>
        <span class="qa-zh">酒廊 · 文章分类</span>
      </a>
      <a class="qa-card" href="public/render.html">
        <span class="qa-icon" aria-hidden="true">✦</span>
        <span class="qa-en">THE GALLERY</span>
        <span class="qa-zh">画廊 · 视觉图集</span>
      </a>
      <a class="qa-card" href="favourite.html">
        <span class="qa-icon" aria-hidden="true">♥</span>
        <span class="qa-en">THE STUDY</span>
        <span class="qa-zh">收藏室 · 喜欢的文章</span>
      </a>
      <a class="qa-card" href="about.html">
        <span class="qa-icon" aria-hidden="true">❧</span>
        <span class="qa-en">THE PARLOUR</span>
        <span class="qa-zh">会客厅 · 关于我</span>
      </a>
    </nav>
  </section>

  <div class="site-footline">
    <span>© 2024 KÖNIGIN · ALL RIGHTS RESERVED</span>
    <span>MADE BY MIMI · FOR MY OWN DOMAIN</span>
  </div>

  <!-- Featured Works 侧滑面板 -->
  <button class="fw-tab" id="fwTab" aria-controls="fwPanel" aria-expanded="false">
    Featured Works ✦
  </button>

  <div class="fw-overlay" id="fwOverlay" aria-hidden="true"></div>

  <aside class="fw-panel" id="fwPanel" role="dialog" aria-modal="false" aria-labelledby="fwTitle" tabindex="-1">
    <div class="fw-header">
      <div>
        <h2 id="fwTitle">FEATURED WORKS</h2>
        <span class="fw-zh">精选作品</span>
      </div>
      <button class="fw-close" id="fwClose" aria-label="关闭">×</button>
    </div>

    <div class="fw-list" id="fwList">
      <!-- 作品卡片由 JS 根据 FEATURED_WORKS 配置渲染 -->
    </div>

    <div class="fw-footer">
      <a href="public/public.html">VIEW ALL WORKS →</a>
    </div>
  </aside>

  <script>
    /* =========================================================
     *  精选作品数据配置
     *  —— 按需增删条目即可。
     *  每一项字段：
     *    cover: 封面图片路径
     *    title: 标题
     *    desc:  简介
     *    tag:   AU / 世界观标签
     *    href:  跳转链接（未定则留 "#"）
     * ========================================================= */
    const FEATURED_WORKS = [
      {
        cover: "../img/render/domestication-cover1.png",
        title: "驯化 · TAME",
        desc:  "小王子长大成国王，遇到了属于他的狐狸。",
        tag:   "R18",
        href:  "../article/public/domestication/catalog.html"
      },
      {
        cover: "../img/public/moscow.png",
        title: "莫斯科变态坏房东",
        desc:  "纯肉",
        tag:   "R18",
        href:  "../article/public/moscow/catalog.html"
      }
    ];

    (function renderFW() {
      const list = document.getElementById('fwList');
      list.innerHTML = FEATURED_WORKS.map(w => {
        const coverStyle = w.cover ? `background-image:url('${w.cover}');` : '';
        return `
          <a class="fw-card" href="${w.href || '#'}">
            <div class="fw-cover" style="${coverStyle}"></div>
            <div class="fw-meta">
              <p class="title">${w.title}</p>
              <p class="desc">${w.desc}</p>
              <span class="tag">${w.tag}</span>
            </div>
          </a>`;
      }).join('');
    })();

    /* =========================================================
     *  面板打开 / 关闭 + 侧滑手势
     * ========================================================= */
    const panel   = document.getElementById('fwPanel');
    const overlay = document.getElementById('fwOverlay');
    const tab     = document.getElementById('fwTab');
    const closeBt = document.getElementById('fwClose');

    function openPanel() {
      panel.classList.add('open');
      overlay.classList.add('open');
      tab.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
      panel.focus();
    }
    function closePanel() {
      panel.classList.remove('open');
      overlay.classList.remove('open');
      tab.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }
    tab.addEventListener('click', openPanel);
    overlay.addEventListener('click', closePanel);
    closeBt.addEventListener('click', closePanel);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && panel.classList.contains('open')) closePanel();
    });

    /* 触屏左滑打开 / 右滑关闭 —— 仅在面板上方或屏幕边缘生效 */
    let touchStartX = null, touchStartY = null;
    const EDGE = 40;      // 右侧边缘感应宽度
    const THRESH = 60;    // 触发阈值
    const VERT_LIMIT = 40;

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (touchStartX == null) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      if (Math.abs(dy) > VERT_LIMIT) { touchStartX = null; return; }

      // 右滑：关闭（面板打开时）
      if (dx > THRESH && panel.classList.contains('open')) {
        closePanel();
      }
      // 左滑：打开（从屏幕右侧边缘开始）
      else if (dx < -THRESH && touchStartX > (window.innerWidth - EDGE) && !panel.classList.contains('open')) {
        openPanel();
      }
      touchStartX = null;
    }, { passive: true });
  </script>
<script src="../js/swipe-back.js"></script>
</body>
</html>
