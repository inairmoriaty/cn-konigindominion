<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KÖNIGIN · 收藏室</title>
  <style>
    :root{
      --gold: #c9a24a;
      --gold-soft: #d8b968;
      --ink: #0d0a07;
      --paper: #ece0c7;
      --paper-dim: #b8a884;
      --serif: "Cormorant Garamond", "EB Garamond", "Playfair Display",
               "Times New Roman", "Songti SC", "SimSun", "宋体", serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--serif);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(201,162,74,.08), transparent 60%),
        radial-gradient(900px 500px at 100% 100%, rgba(201,162,74,.06), transparent 60%),
        var(--ink);
      padding: calc(28px + var(--safe-top)) 24px calc(40px + var(--safe-bottom));
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 960px;
      margin: 0 auto 48px;
    }
    .logo-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: var(--paper);
    }
    .logo-link img { height: 110px; width: auto; display: block; }
    .back-link {
      text-decoration: none;
      color: var(--gold-soft);
      letter-spacing: .25em;
      font-size: 12px;
      text-transform: uppercase;
      border: 1px solid rgba(201,162,74,.35);
      padding: 8px 14px;
      transition: border-color .2s ease, color .2s ease;
    }
    .back-link:hover { border-color: var(--gold); color: var(--paper); }

    main.collection {
      max-width: 960px;
      margin: 0 auto;
    }
    .eyebrow {
      color: var(--gold-soft);
      letter-spacing: .4em;
      font-size: 11px;
      text-transform: uppercase;
      margin: 0 0 10px;
    }
    h1 {
      font-weight: 400;
      font-size: clamp(36px, 6vw, 56px);
      letter-spacing: .14em;
      margin: 0 0 8px;
      color: #f2e6ca;
    }
    .subtitle {
      color: var(--paper-dim);
      letter-spacing: .3em;
      font-size: 13px;
      margin-bottom: 36px;
    }
    hr {
      border: none;
      border-top: 1px solid rgba(201,162,74,.25);
      margin: 28px 0;
    }

    .fav-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      color: var(--paper-dim);
      font-size: 12px;
      letter-spacing: .2em;
    }
    .fav-toolbar button {
      background: transparent;
      border: 1px solid rgba(201,162,74,.3);
      color: var(--gold-soft);
      padding: 6px 12px;
      letter-spacing: .25em;
      font-size: 11px;
      cursor: pointer;
      font-family: var(--serif);
      transition: border-color .2s ease, color .2s ease;
    }
    .fav-toolbar button:hover { border-color: var(--gold); color: var(--paper); }

    .fav-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .fav-card {
      position: relative;
      display: block;
      padding: 18px 20px;
      border: 1px solid rgba(201,162,74,.28);
      text-decoration: none;
      color: var(--paper);
      background: linear-gradient(180deg, rgba(20,15,10,.6), rgba(13,10,7,.9));
      transition: border-color .25s ease, transform .25s ease;
    }
    .fav-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
    }
    .fav-card .fav-title {
      font-size: 17px;
      color: #ead7a3;
      letter-spacing: .1em;
      margin: 0 0 8px;
    }
    .fav-card .fav-meta {
      font-size: 12px;
      color: var(--paper-dim);
      letter-spacing: .1em;
      line-height: 1.7;
    }
    .fav-card .fav-remove {
      position: absolute;
      top: 10px; right: 10px;
      background: transparent;
      border: none;
      color: var(--paper-dim);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      transition: color .2s ease;
    }
    .fav-card .fav-remove:hover { color: #e46a6a; }

    .empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--paper-dim);
      border: 1px dashed rgba(201,162,74,.25);
    }
    .empty p { margin: 6px 0; line-height: 1.9; }
    .empty .hint { font-size: 12px; opacity: .8; letter-spacing: .15em; }

    .toast {
      position: fixed;
      top: 20%; left: 50%;
      transform: translateX(-50%);
      background: rgba(13,10,7,.92);
      border: 1px solid rgba(201,162,74,.35);
      color: var(--paper);
      padding: 10px 18px;
      font-size: 13px;
      letter-spacing: .1em;
      z-index: 999;
      opacity: 0;
      transition: opacity .25s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 640px) {
      body { padding: calc(18px + var(--safe-top)) 16px calc(28px + var(--safe-bottom)); }
      .top-bar { margin-bottom: 28px; }
      .logo-link img { height: 80px; }
      .fav-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <a class="logo-link" href="home.html" aria-label="KÖNIGIN — 返回首页">
      <img src="../img/logo_silver.png" alt="KÖNIGIN">
    </a>
    <a class="back-link" href="home.html">← Home</a>
  </header>

  <main class="collection">
    <p class="eyebrow">THE STUDY</p>
    <h1>收藏室</h1>
    <p class="subtitle">Favourites · 喜欢的文章</p>

    <hr>

    <div class="fav-toolbar">
      <span id="favCount">共 0 篇</span>
      <button id="clearAll" type="button">清空收藏</button>
    </div>

    <div id="favList" class="fav-list"></div>

    <div id="empty" class="empty" hidden>
      <p>这里还空空如也。</p>
      <p class="hint">在文章里点击 ♥ 后，收藏会保留在这个设备上。</p>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="../js/favourite-manager.js"></script>
  <script>
    (function () {
      const listEl  = document.getElementById('favList');
      const emptyEl = document.getElementById('empty');
      const countEl = document.getElementById('favCount');
      const clearBt = document.getElementById('clearAll');
      const toastEl = document.getElementById('toast');

      function flash(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(flash._t);
        flash._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
      }

      function render() {
        const items = (window.favouriteManager?.getAllFavourites() || []).slice().reverse();
        listEl.innerHTML = '';
        countEl.textContent = `共 ${items.length} 篇`;
        emptyEl.hidden = items.length > 0;

        items.forEach(item => {
          const card = document.createElement('a');
          card.className = 'fav-card';
          card.href = item.url || '#';

          const title = document.createElement('div');
          title.className = 'fav-title';
          title.textContent = item.title || item.name || '未命名';

          const meta = document.createElement('div');
          meta.className = 'fav-meta';
          const parts = [];
          if (item.category) parts.push(item.category);
          if (item.date)     parts.push(item.date);
          if (item.au)       parts.push(item.au);
          meta.textContent  = parts.join(' · ') || item.url || '';

          const rm = document.createElement('button');
          rm.className = 'fav-remove';
          rm.type = 'button';
          rm.title = '移除此收藏';
          rm.innerHTML = '×';
          rm.addEventListener('click', (e) => {
            e.preventDefault();
            window.favouriteManager.removeFavourite(item.url);
            flash('已移除');
            render();
          });

          card.appendChild(rm);
          card.appendChild(title);
          card.appendChild(meta);
          listEl.appendChild(card);
        });
      }

      clearBt.addEventListener('click', () => {
        if (!window.favouriteManager?.getAllFavourites()?.length) return;
        if (!confirm('确定清空所有收藏？')) return;
        window.favouriteManager.clearAllFavourites();
        flash('收藏已清空');
        render();
      });

      render();
    })();
  </script>
  <script src="../js/swipe-back.js"></script>
</body>
</html>
